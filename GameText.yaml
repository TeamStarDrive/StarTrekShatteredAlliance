Fed_large_polirised_orbital_armor_Name:
 Id: 30378
 ENG: "Starfleet Polarised Hull Plating (Large)"
Fed_large_polirised_orbital_armor_Desc:
 Id: 30379
 ENG: "Polarised plating, a current run through the hull to stiffen it against impact. It was in use before shields, and still guards the rings of starbases. Strong protection against beams, plasma and explosions, good protection against kinetic rounds. Of the Starfleet orbital plates of its size, it is the lightest and the cheapest to build, but the weakest against energy fire."
Kli_large_polirised_orbital_armor_Name:
 Id: 30380
 ENG: "Klingon Ty'Gokor Ring Plate (Large)"
Kli_large_polirised_orbital_armor_Desc:
 Id: 30381
 ENG: "Polarised plate for the ring of a fortress station, built to withstand a long siege. Strong protection against beams, plasma and explosions, good protection against kinetic rounds. Of the Klingon orbital plates of its size, it is the lightest and the cheapest to build, but the most fragile."
Rom_large_polirised_orbital_armor_Name:
 Id: 30382
 ENG: "Romulan Neutral Zone Ring Plate (Large)"
