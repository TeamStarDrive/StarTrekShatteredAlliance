Fed_PlaSteelArmorSmall_Name:
 Id: 30154
 ENG: "Starfleet Tritanium Plating (Small)"
Fed_PlaSteelArmorSmall_Desc:
 Id: 30155
 ENG: "Transparent aluminium, the strong clear material of Starfleet viewports and cargo bay walls, laminated in layers and rolled opaque for use as hull plate. Its aluminium oxynitride matrix is aligned at the molecular level, so it is far stronger than it looks. Some protection against explosions. Of the Starfleet ship plates of its size, it is the lightest and the easiest to repair, but the weakest against beams."
