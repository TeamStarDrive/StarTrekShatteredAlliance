 Id: 30250
 ENG: "Borg Tactical Ablative Plate (Medium)"
Bor_ablative_ship_armor_med_Desc:
 Id: 30251
 ENG: "Ablative hull armour of the kind fitted to long-range tactical vessels, built to be burned away so the structure beneath stays whole. Good protection against kinetic rounds, beams, energy fire and explosions, some protection against plasma. Of the Borg ship plates of its size, it is the toughest and the best protected against beams, but the heaviest."
Fed_Organic_Bioplates_Large_Name:
 Id: 30252
 ENG: "Starfleet Regenerative Nanite Plating (Large)"
Fed_Organic_Bioplates_Large_Desc:
 Id: 30253
 ENG: "Plate grown on a bio-neural substrate, a living gel that senses damage and lays down new material at the edge of a breach. The substrate is tuned to the ship's own power grid, and the plate knits itself whole between engagements. Strong protection against energy fire, plasma and explosions. Of the Starfleet orbital plates of its size, it is the most fragile."
Kli_Organic_Bioplates_Large_Name:
 Id: 30254
 ENG: "Klingon Brak'lul Bioplate (Large)"
Kli_Organic_Bioplates_Large_Desc:
 Id: 30255
 ENG: "Klingons are born with two of every organ, and so is this plate. When one layer is wounded, a spare takes its place. Strong protection against every kind of fire. Of the Klingon orbital plates of its size, it is the best protected against explosions."
Rom_Organic_Bioplates_Large_Name:
 Id: 30256
 ENG: "Romulan Reman Bioplate (Large)"
Rom_Organic_Bioplates_Large_Desc:
 Id: 30257
 ENG: "Plate grown in the manner of the Remans, whose labour built much of the Empire, and mended by the same slow patience. Strong protection against every kind of fire. Of the Romulan orbital plates of its size, it is the best protected against explosions."
Car_Organic_Bioplates_Large_Name:
 Id: 30258
 ENG: "Cardassian Reclamation Bioplate (Large)"
Car_Organic_Bioplates_Large_Desc:
 Id: 30259
 ENG: "Living plate regrown from reclaimed waste. A people short of resources learn to waste nothing, armour included. Strong protection against every kind of fire. Of the Cardassian orbital plates of its size, it is the best protected against explosions."
Dom_Organic_Bioplates_Large_Name:
 Id: 30260
 ENG: "Dominion Vat-Grown Organic Plate (Large)"
Dom_Organic_Bioplates_Large_Desc:
 Id: 30261
 ENG: "Plate grown to order in the Dominion's habit of breeding what it needs, the way it bred the Jem'Hadar, and left to mend itself. Strong protection against every kind of fire. Of the Dominion orbital plates of its size, it is the best protected against explosions."
Vul_Organic_Bioplates_Large_Name:
 Id: 30262
 ENG: "Vulcan Healing Trance Bioplate (Large)"
Vul_Organic_Bioplates_Large_Desc:
 Id: 30263
 ENG: "Plate that repairs itself in a slow, disciplined cycle, named for the healing trance in which a Vulcan mends injuries. Strong protection against every kind of fire. Of the Vulcan orbital plates of its size, it is the best protected against explosions."
Bor_Organic_Bioplates_Large_Name:
 Id: 30264
 ENG: "Borg Regenerative Hull Plate (Large)"
Bor_Organic_Bioplates_Large_Desc:
 Id: 30265
 ENG: "A regenerative hull, tended by nanoprobes. A cube can lose most of its mass and keep working, because its systems are decentralised and redundant. Strong protection against every kind of fire. Of the Borg orbital plates of its size, it is the best protected against explosions."
Fed_Organic_Bioplates_Med_Name:
 Id: 30266
 ENG: "Starfleet Regenerative Nanite Plating (Medium)"
Fed_Organic_Bioplates_Med_Desc:
 Id: 30267
 ENG: "Plate grown on a bio-neural substrate, a living gel that senses damage and lays down new material at the edge of a breach. The substrate is tuned to the ship's own power grid, and the plate knits itself whole between engagements. Strong protection against every kind of fire. Of the Starfleet orbital plates of its size, it is the lightest, but the hardest to repair."
Kli_Organic_Bioplates_Med_Name:
 Id: 30268
 ENG: "Klingon Brak'lul Bioplate (Medium)"
Kli_Organic_Bioplates_Med_Desc:
 Id: 30269
 ENG: "Klingons are born with two of every organ, and so is this plate. When one layer is wounded, a spare takes its place. Strong protection against every kind of fire. Of the Klingon orbital plates of its size, it is the lightest, but the hardest to repair."
Rom_Organic_Bioplates_Med_Name:
 Id: 30270
 ENG: "Romulan Reman Bioplate (Medium)"
Rom_Organic_Bioplates_Med_Desc:
 Id: 30271
 ENG: "Plate grown in the manner of the Remans, whose labour built much of the Empire, and mended by the same slow patience. Strong protection against every kind of fire. Of the Romulan orbital plates of its size, it is the lightest, but the hardest to repair."
Car_Organic_Bioplates_Med_Name:
 Id: 30272
 ENG: "Cardassian Reclamation Bioplate (Medium)"
Car_Organic_Bioplates_Med_Desc:
 Id: 30273
 ENG: "Living plate regrown from reclaimed waste. A people short of resources learn to waste nothing, armour included. Strong protection against every kind of fire. Of the Cardassian orbital plates of its size, it is the lightest, but the hardest to repair."
Dom_Organic_Bioplates_Med_Name:
 Id: 30274
 ENG: "Dominion Vat-Grown Organic Plate (Medium)"
Dom_Organic_Bioplates_Med_Desc:
 Id: 30275
 ENG: "Plate grown to order in the Dominion's habit of breeding what it needs, the way it bred the Jem'Hadar, and left to mend itself. Strong protection against every kind of fire. Of the Dominion orbital plates of its size, it is the lightest, but the hardest to repair."
Vul_Organic_Bioplates_Med_Name:
 Id: 30276
 ENG: "Vulcan Healing Trance Bioplate (Medium)"
Vul_Organic_Bioplates_Med_Desc:
 Id: 30277
 ENG: "Plate that repairs itself in a slow, disciplined cycle, named for the healing trance in which a Vulcan mends injuries. Strong protection against every kind of fire. Of the Vulcan orbital plates of its size, it is the lightest, but the hardest to repair."
Bor_Organic_Bioplates_Med_Name:
 Id: 30278
 ENG: "Borg Regenerative Hull Plate (Medium)"
Bor_Organic_Bioplates_Med_Desc:
 Id: 30279
 ENG: "A regenerative hull, tended by nanoprobes. A cube can lose most of its mass and keep working, because its systems are decentralised and redundant. Strong protection against every kind of fire. Of the Borg orbital plates of its size, it is the lightest, but the hardest to repair."
