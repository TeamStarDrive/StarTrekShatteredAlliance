Dom_ArmoredShield4x4_Desc:
 Id: 30485
 ENG: "Emitters set deep in armoured housings, since a Jem'Hadar commander would sooner lose a plate than an emitter. Strong protection against beams and energy fire. Weak against kinetic rounds."
Vul_ArmoredShield4x4_Name:
 Id: 30486
