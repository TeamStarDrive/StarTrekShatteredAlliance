Rom_CanopyShield_Desc:
 Id: 30495
 ENG: "A deflector canopy drawn over a warbird's wide hull. Strong protection against beams and energy fire. Weak against kinetic rounds. Of the Romulan ship shields, size for size, it is the slowest to come back after being knocked down."
