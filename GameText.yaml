 Id: 30214
 ENG: "Romulan Raider Ablative Plate (Small)"
Rom_ablative_ship_armor_Small_Desc:
 Id: 30215
 ENG: "Ablative plate for the raiders of the Star Empire, made to be shed rather than repaired. Some protection against kinetic rounds, beams, energy fire and explosions. Of the Romulan ship plates of its size, it is the toughest and the best protected against beams, but the heaviest."
Car_ablative_ship_armor_Small_Name:
 Id: 30216
 ENG: "Cardassian Burn-Off Plate (Small)"
Car_ablative_ship_armor_Small_Desc:
 Id: 30217
 ENG: "Ablative plate that burns away in layers, so the first hits fall on plating and not on the crew. The Union has plenty of plate and fewer ships than it needs. Some protection against kinetic rounds, beams, energy fire and explosions. Of the Cardassian ship plates of its size, it is the toughest and the best protected against beams, but the heaviest."
