 ENG: "Dominion Jem'Hadar Deflector Canopy"
Dom_CanopyShield_Desc:
 Id: 30499
 ENG: "A deflector canopy drawn over the hull of a Jem'Hadar warship. Strong protection against beams and energy fire. Weak against kinetic rounds. Of the Dominion ship shields, size for size, it is the slowest to come back after being knocked down."
