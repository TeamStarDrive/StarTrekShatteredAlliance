Vul_CanopyShield_Desc:
 Id: 30501
 ENG: "A deflector canopy drawn over the whole of a ring ship's hull. Strong protection against beams and energy fire. Weak against kinetic rounds. Of the Vulcan ship shields, size for size, it is the slowest to come back after being knocked down."
Bor_CanopyShield_Name:
 Id: 30502
 ENG: "Borg Collective Canopy Field"
Bor_CanopyShield_Desc:
 Id: 30503
 ENG: "A canopy field drawn over a large vessel from many nodes at once, thinking and adapting as one. Strong protection against beams and energy fire. Weak against kinetic rounds. Of the Borg ship shields, size for size, it is the slowest to come back after being knocked down."
Fed_Shield_10KW_Name:
 Id: 30504
 ENG: "Starfleet Deflector Shield (Heavy)"
Fed_Shield_10KW_Desc:
 Id: 30505
 ENG: "The main deflector grid of Starfleet cruisers, with its emitters spread over the hull to keep the field even. Strong protection against beams and energy fire. Weak against kinetic rounds."
Kli_Shield_10KW_Name:
 Id: 30506
 ENG: "Klingon D7 Deflector Grid"
Kli_Shield_10KW_Desc:
 Id: 30507
 ENG: "The deflector grid of the D7 battlecruiser, the old warhorse of the fleet. Strong protection against beams and energy fire. Weak against kinetic rounds."
Rom_Shield_10KW_Name:
 Id: 30508
 ENG: "Romulan D'deridex Deflector Grid"
Rom_Shield_10KW_Desc:
 Id: 30509
 ENG: "The deflector shields of the D'deridex-class warbird, with an artificial quantum singularity behind them. \"Romulans. I'll be damned.\" (Benjamin Sisko, DS9: \"By Inferno's Light\") Strong protection against beams and energy fire. Weak against kinetic rounds."
Car_Shield_10KW_Name:
 Id: 30510
 ENG: "Cardassian Galor Shield Grid"
Car_Shield_10KW_Desc:
 Id: 30511
 ENG: "The Galor-class carried its shield generators in the tail, aft of the hull. Heavy and thorough, it is the backbone of the Cardassian fleet. Strong protection against beams and energy fire. Weak against kinetic rounds."
Dom_Shield_10KW_Name:
 Id: 30512
 ENG: "Dominion Battle Cruiser Deflector Grid"
Dom_Shield_10KW_Desc:
 Id: 30513
 ENG: "The deflector grid of the Dominion battle cruisers, which led the fleet at the Second Battle of Deep Space 9. Strong protection against beams and energy fire. Weak against kinetic rounds."
Vul_Shield_10KW_Name:
 Id: 30514
 ENG: "Vulcan D'Kyr Deflector Grid"
Vul_Shield_10KW_Desc:
 Id: 30515
 ENG: "The deflector grid of the D'Kyr-class, the High Command's cruiser. The Earth phase cannons of the day could not get through it. Strong protection against beams and energy fire. Weak against kinetic rounds."
Bor_Shield_10KW_Name:
 Id: 30516
 ENG: "Borg Cube Subspace Field"
Bor_Shield_10KW_Desc:
 Id: 30517
 ENG: "The subspace field of a Borg cube. Varying the weapon frequency helps an enemy only for a short while. Strong protection against beams and energy fire. Weak against kinetic rounds."
Fed_Shield_1KW_Name:
 Id: 30518
 ENG: "Starfleet Deflector Shield (Basic)"
Fed_Shield_1KW_Desc:
 Id: 30519
 ENG: "The standard deflector generator of Starfleet escorts and patrol craft, with its emitters modulated across a narrow frequency band. Good protection against beams and energy fire. Weak against kinetic rounds. Of the Starfleet ship shields, size for size, it covers the narrowest area."
Kli_Shield_1KW_Name:
 Id: 30520
 ENG: "Klingon Patrol Deflector Generator"
Kli_Shield_1KW_Desc:
 Id: 30521
 ENG: "The standard deflector generator of Klingon patrol ships. Good protection against beams and energy fire. Weak against kinetic rounds. Of the Klingon ship shields, size for size, it covers the narrowest area."
Rom_Shield_1KW_Name:
 Id: 30522
 ENG: "Romulan Border Patrol Deflector"
Rom_Shield_1KW_Desc:
 Id: 30523
 ENG: "The deflector generator of the patrol ships that watch the Neutral Zone. Good protection against beams and energy fire. Weak against kinetic rounds. Of the Romulan ship shields, size for size, it covers the narrowest area."
Car_Shield_1KW_Name:
 Id: 30524
 ENG: "Cardassian Patrol Shield Generator"
Car_Shield_1KW_Desc:
 Id: 30525
 ENG: "The standard generator of the Union's small patrol craft and escorts. Good protection against beams and energy fire. Weak against kinetic rounds. Of the Cardassian ship shields, size for size, it covers the narrowest area."
Dom_Shield_1KW_Name:
 Id: 30526
 ENG: "Dominion Border Patrol Deflector"
Dom_Shield_1KW_Desc:
 Id: 30527
 ENG: "The deflector generator of the Jem'Hadar patrols that watch the edges of Dominion space. Good protection against beams and energy fire. Weak against kinetic rounds. Of the Dominion ship shields, size for size, it covers the narrowest area."
Vul_Shield_1KW_Name:
 Id: 30528
 ENG: "Vulcan Patrol Deflector Generator"
Vul_Shield_1KW_Desc:
 Id: 30529
 ENG: "The standard deflector generator of Vulcan patrol vessels, built to the specification and no further. Good protection against beams and energy fire. Weak against kinetic rounds. Of the Vulcan ship shields, size for size, it covers the narrowest area."
Bor_Shield_1KW_Name:
 Id: 30530
 ENG: "Borg Drone Subspace Field"
Bor_Shield_1KW_Desc:
 Id: 30531
 ENG: "The standard field of a single drone vessel, adjusting to whatever weapon is turned on it. Good protection against beams and energy fire. Weak against kinetic rounds. Of the Borg ship shields, size for size, it covers the narrowest area."
Fed_advanced_CanopyShields_Name:
 Id: 30532
 ENG: "Starfleet Deflector Shield (Advanced Canopy)"
Fed_advanced_CanopyShields_Desc:
 Id: 30533
 ENG: "An experimental canopy that applies transphasic subspace compression to the field. The phase configuration is randomised so it cannot be predicted. Strong protection against beams and energy fire. Weak against kinetic rounds. Of the Starfleet ship shields, size for size, it holds the most energy and covers the widest area, but draws the most power."
Kli_advanced_CanopyShields_Name:
 Id: 30534
 ENG: "Klingon Negh'Var Deflector Canopy"
Kli_advanced_CanopyShields_Desc:
 Id: 30535
 ENG: "The deflector canopy of a Negh'Var-class warship, the flagship of the fleet. Strong protection against beams and energy fire. Weak against kinetic rounds. Of the Klingon ship shields, size for size, it holds the most energy and covers the widest area, but draws the most power."
Rom_advanced_CanopyShields_Name:
 Id: 30536
 ENG: "Romulan Praetor's Canopy Array"
Rom_advanced_CanopyShields_Desc:
 Id: 30537
 ENG: "The canopy of the Praetor's own ships, with every emitter locked together. Strong protection against beams and energy fire. Weak against kinetic rounds. Of the Romulan ship shields, size for size, it holds the most energy and covers the widest area, but draws the most power."
Car_advanced_CanopyShields_Name:
 Id: 30538
 ENG: "Cardassian Dreadnought Canopy Shield"
Car_advanced_CanopyShields_Desc:
 Id: 30539
 ENG: "The canopy field of the biggest Cardassian warships. Meant to cover a whole squadron at once. Strong protection against beams and energy fire. Weak against kinetic rounds. Of the Cardassian ship shields, size for size, it holds the most energy and covers the widest area, but draws the most power."
Dom_advanced_CanopyShields_Name:
 Id: 30540
 ENG: "Dominion Vorta Command Canopy"
Dom_advanced_CanopyShields_Desc:
 Id: 30541
