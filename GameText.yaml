 Id: 30167
 ENG: "Plate extruded by assimilated fabrication nodes. Drones lay it down in the pattern the Collective has judged the most efficient. Some protection against explosions. Of the Borg ship plates of its size, it is the lightest and the easiest to repair, but the weakest against beams."
Fed_SteelArmorLarge_Name:
 Id: 30168
 ENG: "Starfleet Duranium Plating (Large)"
Fed_SteelArmorLarge_Desc:
 Id: 30169
 ENG: "Duranium alloy plate, the standard hull armour of Starfleet starships. Plain, dependable, and repairable at any dock in the Federation. Gives almost no protection against fire; it is there to soak up damage. Of the Starfleet ship plates of its size, it is the cheapest to build and the easiest to repair, but the most fragile."
Kli_SteelArmorLarge_Name:
 Id: 30170
 ENG: "Klingon Battlecruiser Hull Plate (Large)"
Kli_SteelArmorLarge_Desc:
 Id: 30171
 ENG: "Heavy plate for the battlecruisers of the Empire, thick and unadorned. \"...a military ship, not a pleasure craft.\" (Captain K'Vada, TNG: \"Unification I\") Gives almost no protection against fire; it is there to soak up damage. Of the Klingon ship plates of its size, it is the cheapest to build and the easiest to repair, but the most fragile."
Rom_SteelArmorLarge_Name:
 Id: 30172
 ENG: "Romulan Warbird Hull Plate (Large)"
Rom_SteelArmorLarge_Desc:
 Id: 30173
 ENG: "Heavy plate for the warbirds of the Star Empire, made for ships that are large, patient and fond of hiding. Gives almost no protection against fire; it is there to soak up damage. Of the Romulan ship plates of its size, it is the cheapest to build and the easiest to repair, but the most fragile."
Car_SteelArmorLarge_Name:
 Id: 30174
 ENG: "Cardassian Galor Hull Plate (Large)"
Car_SteelArmorLarge_Desc:
 Id: 30175
 ENG: "Hull plate of uridium alloy, a staple of Cardassian shipbuilding. Plain, in the ochre of the Union's fleets, and sound enough to bring a ship home. \"...could not defend itself against one Cardassian warship...\" (Gul Jasad, DS9: \"Emissary\") Gives almost no protection against fire; it is there to soak up damage. Of the Cardassian ship plates of its size, it is the cheapest to build and the easiest to repair, but the most fragile."
Dom_SteelArmorLarge_Name:
 Id: 30176
 ENG: "Dominion Jem'Hadar Hull Plate (Large)"
Dom_SteelArmorLarge_Desc:
 Id: 30177
 ENG: "Heavy plate for the warships of the Jem'Hadar, who were bred for war and count comfort a weakness. \"Remember: victory is life.\" (First Omet'iklan, DS9: \"To the Death\") Gives almost no protection against fire; it is there to soak up damage. Of the Dominion ship plates of its size, it is the cheapest to build and the easiest to repair, but the most fragile."
Vul_SteelArmorLarge_Name:
 Id: 30178
 ENG: "Vulcan High Command Hull Plate (Large)"
Vul_SteelArmorLarge_Desc:
 Id: 30179
 ENG: "Plain plate for the starships of the Vulcan High Command, cut to the exact dimensions the design calls for and nothing more. Gives almost no protection against fire; it is there to soak up damage. Of the Vulcan ship plates of its size, it is the cheapest to build and the easiest to repair, but the most fragile."
Bor_SteelArmorLarge_Name:
 Id: 30180
 ENG: "Borg Tritanium Cube Plate (Large)"
Bor_SteelArmorLarge_Desc:
 Id: 30181
 ENG: "Plain tritanium alloy, the metal of the Borg cube. There is no ornament and no deck plan, only the hull, shaped to what the Collective needs. Gives almost no protection against fire; it is there to soak up damage. Of the Borg ship plates of its size, it is the cheapest to build and the easiest to repair, but the most fragile."
