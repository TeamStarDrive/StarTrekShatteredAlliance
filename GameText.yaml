Fed_ablative_ship_armor_Small_Name:
 Id: 30210
 ENG: "Starfleet Ablative Armour (Small)"
Fed_ablative_ship_armor_Small_Desc:
 Id: 30211
 ENG: "Ablative armour, as fitted to the USS Defiant: layers that burn away under fire and leave the hull beneath whole. Some protection against kinetic rounds, beams, energy fire and explosions. Of the Starfleet ship plates of its size, it is the toughest and the best protected against beams, but the heaviest."
Kli_ablative_ship_armor_Small_Name:
 Id: 30212
 ENG: "Klingon Refit Ablative Plate (Small)"
Kli_ablative_ship_armor_Small_Desc:
 Id: 30213
 ENG: "Extra armour of the kind added to Klingon cruisers in their refits, meant to be burned away in battle. Some protection against kinetic rounds, beams, energy fire and explosions. Of the Klingon ship plates of its size, it is the toughest and the best protected against beams, but the heaviest."
