 Id: 30383
 ENG: "Polarised plate for the ring of a Neutral Zone station, built to take a surprise. Strong protection against beams, plasma and explosions, good protection against kinetic rounds. Of the Romulan orbital plates of its size, it is the lightest and the cheapest to build, but the most fragile."
Car_large_polirised_orbital_armor_Name:
 Id: 30384
 ENG: "Cardassian Orbital Ring Plate (Large)"
Car_large_polirised_orbital_armor_Desc:
 Id: 30385
 ENG: "Polarised plating for a station's habitat ring, tuned to bleed off energy fire and built to hold through a long siege. Strong protection against beams, plasma and explosions, good protection against kinetic rounds. Of the Cardassian orbital plates of its size, it is the lightest and the cheapest to build, but the most fragile."
Dom_large_polirised_orbital_armor_Name:
 Id: 30386
 ENG: "Dominion Omarion Ring Plate (Large)"
Dom_large_polirised_orbital_armor_Desc:
 Id: 30387
 ENG: "Polarised plate for the rings of the stations in the Omarion Nebula, which hides the Founders' homeworld. Strong protection against beams, plasma and explosions, good protection against kinetic rounds. Of the Dominion orbital plates of its size, it is the lightest and the cheapest to build, but the most fragile."
