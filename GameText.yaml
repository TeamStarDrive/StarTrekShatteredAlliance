Fed_CanopyShield_Name:
 Id: 30490
 ENG: "Starfleet Deflector Shield (Canopy)"
Fed_CanopyShield_Desc:
 Id: 30491
 ENG: "A canopy field drawn over the largest hulls from a ring of emitters, with the harmonics phase-locked across the whole span. Strong protection against beams and energy fire. Weak against kinetic rounds. Of the Starfleet ship shields, size for size, it is the slowest to come back after being knocked down."
Kli_CanopyShield_Name:
 Id: 30492
 ENG: "Klingon Battlecruiser Deflector Canopy"
Kli_CanopyShield_Desc:
 Id: 30493
 ENG: "A deflector canopy drawn over a battlecruiser's whole hull. Strong protection against beams and energy fire. Weak against kinetic rounds. Of the Klingon ship shields, size for size, it is the slowest to come back after being knocked down."
Rom_CanopyShield_Name:
 Id: 30494
